    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Bebas+Neue&family=Caveat:wght@600;700&family=Cinzel:wght@600;700;800&family=Dancing+Script:wght@400;700&family=Fredoka:wght@500;600;700&family=Great+Vibes&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@400;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&family=Satisfy&display=swap" rel="stylesheet">

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Registro Automático do Service Worker PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('✅ Celebre Service Worker registrado com sucesso:', reg.scope);
            })
            .catch((err) => {
              console.warn('Service Worker não pôde ser registrado:', err);
            });
        });
      }
    </script>
  </body>
</html>

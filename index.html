    <!-- 🎨 Sincronização Imediata de Tema e Cor de Destaque antes da renderização -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme') || 'light';
          var savedAccent = localStorage.getItem('accentColor') || '#c5a059';
          var savedDarkStyle = localStorage.getItem('darkStyle') || 'gray';
          var isDark = savedTheme.indexOf('dark') !== -1;
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-dark-style', isDark ? savedDarkStyle : 'none');

          var escurecerHex = function(hex, percent) {
            try {
              var c = hex.replace('#', '');
              if (c.length === 3) c = c.split('').map(function(x) { return x + x; }).join('');
              var num = parseInt(c, 16);
              var p = percent || 18;
              var r = Math.max(0, (num >> 16) - Math.round(255 * (p / 100)));
              var g = Math.max(0, ((num >> 8) & 0x00FF) - Math.round(255 * (p / 100)));
              var b = Math.max(0, (num & 0x0000FF) - Math.round(255 * (p / 100)));
              return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            } catch (e) { return hex; }
          };

          var darkerAccent = escurecerHex(savedAccent, 18);
          document.documentElement.style.setProperty('--dourado', savedAccent, 'important');
          document.documentElement.style.setProperty('--cor-destaque', savedAccent, 'important');
          document.documentElement.style.setProperty('--primary-color', savedAccent, 'important');
          document.documentElement.style.setProperty('--gold-primary', savedAccent, 'important');
          document.documentElement.style.setProperty('--gold-dark', darkerAccent, 'important');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Registro Automático do Service Worker PWA (Apenas em Produção) -->
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (const name of names) caches.delete(name);
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((reg) => {
                console.log('✅ Celebre Service Worker registrado com sucesso:', reg.scope);
              })
              .catch((err) => {
                console.warn('Service Worker não pôde ser registrado:', err);
              });
          });
        }
      }
    </script>
  </body>
